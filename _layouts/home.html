---
layout: page
---

{{ content }}

{% assign date_format = site.date_format | default: "%b %-d, %Y" %}

<ul class="posts-list">
  {% for post in site.posts %}
  <li class="post-preview">
    <span class="post-meta">{{ post.date | date: date_format }}</span>
    <div>
      <a href="{{ post.external_url }}">{{ post.title | strip_html }}</a>
      {% if post.subtitle %}<div class="post-excerpt">{{ post.subtitle }}</div>{% endif %}
    </div>
  </li>
  {% endfor %}
</ul>
